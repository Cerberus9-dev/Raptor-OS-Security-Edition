<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.raptor.TorManager"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.raptor.TorManager"
           send_interface="org.raptor.TorManager1"
           send_member="GetStatus"/>
  </policy>

  <policy group="raptor-admin">
    <allow send_destination="org.raptor.TorManager"
           send_interface="org.raptor.TorManager1"
           send_member="Start"/>
    <allow send_destination="org.raptor.TorManager"
           send_interface="org.raptor.TorManager1"
           send_member="Stop"/>
    <allow send_destination="org.raptor.TorManager"
           send_interface="org.raptor.TorManager1"
           send_member="NewIdentity"/>
  </policy>
</busconfig>
