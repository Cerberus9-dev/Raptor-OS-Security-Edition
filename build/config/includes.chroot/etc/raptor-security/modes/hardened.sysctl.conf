# Hardened mode kernel hardening — spec section 8.
# Conservative set: real hardening value, low odds of breaking normal
# desktop/pentest-tool use (e.g. NOT disabling packet forwarding globally,
# since VPN/network tools may legitimately need it).

net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1

# COMPATIBILITY FLAG (spec section 8: "every hardening feature must be
# tested for compatibility"): ptrace_scope=1 restricts gdb/strace/ltrace to
# attaching only to their own child processes, not arbitrary running
# processes — this directly affects the Reverse Engineering toolset
# (section 15) this same OS ships. Needs an explicit decision: leave as-is
# and document that RE work in Hardened mode requires launching targets
# under gdb rather than attaching, or exempt ptrace_scope from Hardened
# and only apply it in Lockdown. Not resolving that choice here.
