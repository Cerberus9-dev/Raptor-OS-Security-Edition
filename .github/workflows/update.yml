name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raptor-security-update
  cancel-in-progress: true

jobs:
  update:
    name: Rebuild Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show live-build version
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            .build \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source \
            config/archives

      - name: Restore repository archive configuration
        working-directory: build
        run: |
          mkdir -p config/archives

          cat > config/archives/base.list.chroot <<'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          EOF

          cat > config/archives/security.list.chroot <<'EOF'
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Remove obsolete generated security repositories
        working-directory: build
        run: |
          find config -type f -print0 | while IFS= read -r -d '' file; do
            if grep -qE 'security\.debian\.org.*bookworm/updates|deb\.debian\.org/debian-security.*bookworm/updates' "$file" 2>/dev/null; then
              sed -i -E '/security\.debian\.org.*bookworm\/updates/d' "$file"
              sed -i -E '/deb\.debian\.org\/debian-security.*bookworm\/updates/d' "$file"
            fi
          done

      - name: Verify archive configuration
        working-directory: build
        run: |
          echo "===== base.list.chroot ====="
          cat config/archives/base.list.chroot

          echo
          echo "===== security.list.chroot ====="
          cat config/archives/security.list.chroot

          echo
          echo "===== generated archive configuration ====="
          find config -type f \
            \( -name '*.list*' -o -name '*.conf' \) \
            -print \
            -exec grep -HnE \
            'debian-security|bookworm-security|bookworm/updates|security\.debian\.org' {} \; \
            2>/dev/null || true

      - name: Verify no obsolete security repository exists
        working-directory: build
        run: |
          if grep -RniE \
            'security\.debian\.org.*bookworm/updates|deb\.debian\.org/debian-security.*bookworm/updates' \
            config/ \
            2>/dev/null; then
            echo "ERROR: obsolete bookworm/updates security repository found."
            exit 1
          fi

          echo "No obsolete security repository found."

      - name: Build updated OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify build
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi

          echo "Raptor OS Security update build succeeded:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload updated OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
