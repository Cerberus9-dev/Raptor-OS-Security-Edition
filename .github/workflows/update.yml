name: Build Raptor OS Security Update

# Unlike build-iso.yml (manual only, matches home edition's convention for
# fresh-install images), this one also runs weekly — Security Edition is a
# Live ISO people re-download and re-flash rather than an atomically
# updatable image like home edition's Bazzite base, so a scheduled rebuild
# is how it picks up upstream Debian package/security updates at all.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # weekly, Sunday 05:00 UTC

permissions:
  contents: read

concurrency:
  group: raptor-security-update
  cancel-in-progress: true

jobs:
  update:
    name: Rebuild Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache key includes the current ISO week — deliberately DIFFERENT
      # from build-iso.yml's permanent content-hash-only key. This
      # workflow's whole purpose is fetching fresh upstream Debian
      # updates on a schedule; a permanent cache key would silently
      # restore last week's packages forever and defeat that entirely.
      # A weekly-rotating key still speeds up same-week re-runs (e.g. a
      # manual retry after a transient network failure) without ever
      # skipping the actual weekly update check.
      - name: Get cache week
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache live-build stages (weekly)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: raptor-security-lb-update-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('build/config/package-lists/*.list.chroot', 'build/config/hooks/live/*.hook.chroot', 'build/auto/config') }}
          restore-keys: |
            raptor-security-lb-update-${{ runner.os }}-${{ steps.cache-week.outputs.week }}-

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show build tool versions
        run: |
          lb --version
          debootstrap --version

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation. Kept identical between the two workflows
      # deliberately, so there's exactly one place this ever needs
      # updating if the live-build package changes.
      - name: Patch live-build Contents index lookup
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_linux-image"
          sudo sed -i \
            's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"
          sudo sed -i \
            's#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

      # Same fix as build-iso.yml — see that workflow's comment for the
      # full explanation and how it was confirmed against a real failed run.
      - name: Patch live-build security suite name
        run: |
          set -e
          LB_FILE="/usr/lib/live/build/lb_chroot_archives"
          sudo sed -i '/SECURITY/ s#/updates#-security#g' "$LB_FILE"
          grep -n "VOLATILE" "$LB_FILE" | grep -- "-updates" || echo "WARNING: expected VOLATILE lines not found — investigate before trusting this build"

      - name: Clean previous build artifacts (preserving cache)
        working-directory: build
        run: |
          sudo rm -rf chroot binary .build
          sudo rm -f config/bootstrap config/chroot config/binary config/common config/source
          echo "cache/ contents preserved:"
          du -sh cache 2>/dev/null || echo "cache/ is empty (first run this week, or nothing restored)"

      - name: Configure live-build
        working-directory: build
        run: |
          set -e
          chmod +x auto/config
          ./auto/config

      - name: Build updated ISO
        working-directory: build
        run: sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi
          echo "Raptor OS Security build succeeded:"
          ls -lh "$ISO"
          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
