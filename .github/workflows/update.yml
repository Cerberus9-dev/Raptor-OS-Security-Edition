name: Update Raptor Security ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            dosfstools \
            mtools \
            rsync \
            curl \
            wget

      - name: Clean previous live-build configuration
        working-directory: build
        run: |
          sudo lb clean --purge || true

          rm -rf config/binary
          rm -rf config/bootstrap
          rm -rf config/chroot
          rm -rf config/common
          rm -rf config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify generated configuration
        working-directory: build
        run: |
          echo "=== live-build configuration ==="
          lb config --dump || true

          echo "=== Searching for obsolete security suite ==="
          if grep -RInE \
            'security\.debian\.org.*bookworm/updates|debian-security.*bookworm/updates|bookworm/updates' \
            config auto 2>/dev/null; then
            echo "ERROR: obsolete bookworm/updates repository found"
            exit 1
          fi

          echo "=== Repository configuration ==="
          grep -RInE \
            'bookworm(-security|-updates)?' \
            config 2>/dev/null || true

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: List build output
        working-directory: build
        run: |
          ls -lah
          find . -maxdepth 1 -type f \
            \( -name '*.iso' -o -name '*.img' -o -name '*.hybrid.iso' \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.img
            build/*.hybrid.iso
          if-no-files-found: error
