name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Build Raptor OS Security Update
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Show live-build version
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf cache
          sudo rm -rf chroot
          sudo rm -rf binary

          rm -f config/bootstrap
          rm -f config/chroot
          rm -f config/binary
          rm -f config/common
          rm -f config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Force correct Debian repositories
        working-directory: build
        run: |
          mkdir -p config/includes.chroot/etc/apt

          cat > config/includes.chroot/etc/apt/sources.list <<'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          echo "===== Raptor OS sources.list ====="
          cat config/includes.chroot/etc/apt/sources.list

          echo
          echo "===== Checking repository tree ====="

          if grep -Rni \
            'bookworm/updates' \
            config/includes.chroot \
            config/package-lists \
            config/hooks \
            2>/dev/null; then

            echo "ERROR: invalid bookworm/updates repository found."
            exit 1
          fi

          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ \
            2>/dev/null; then

            echo "ERROR: Ubuntu repository configuration found."
            exit 1
          fi

      - name: Build Raptor OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify build
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "===== Raptor OS Security build successful ====="
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          echo
          echo "===== SHA256 ====="
          cat raptor-security.sha256

      - name: Upload updated OS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
