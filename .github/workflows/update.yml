name: Build Raptor OS Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Show build configuration
        working-directory: build
        run: |
          echo "===== build/auto/config ====="
          cat auto/config
          echo
          echo "===== Checking for unsupported options ====="
          if grep -RniE 'bootloaders|uefi-secure-boot' .; then
            echo "ERROR: Unsupported bootloader options found."
            exit 1
          fi

      - name: Configure live-build
        working-directory: build
        run: bash auto/config

      - name: Build Raptor OS
        working-directory: build
        run: sudo lb build

      - name: Verify build
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "Build successful:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          echo "SHA256:"
          cat raptor-security.sha256

      - name: Upload updated OS
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
