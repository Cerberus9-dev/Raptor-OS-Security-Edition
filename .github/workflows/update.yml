name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Raptor OS Security Update
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Clean generated live-build state
        working-directory: build
        run: |
          sudo lb clean --purge || true

          rm -rf cache
          rm -rf chroot
          rm -rf binary

          rm -f config/bootstrap
          rm -f config/chroot
          rm -f config/binary
          rm -f config/common
          rm -f config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Fix Debian security repository
        working-directory: build
        run: |
          echo "Fixing old Bookworm security suite name..."

          find config -type f -print0 | while IFS= read -r -d '' file; do
            if grep -q 'bookworm/updates' "$file" 2>/dev/null; then
              echo "Fixing: $file"
              sed -i 's/bookworm\/updates/bookworm-security/g' "$file"
            fi
          done

          echo
          echo "Checking generated configuration..."

          if grep -Rni 'bookworm/updates' config/; then
            echo "ERROR: bookworm/updates is still present."
            exit 1
          fi

          echo
          echo "Security repository configuration:"
          grep -Rni 'bookworm-security' config/ || true

      - name: Check for Ubuntu repositories
        working-directory: build
        run: |
          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/; then

            echo "ERROR: Ubuntu configuration found."
            exit 1
          fi

          echo "No Ubuntu repositories found."

      - name: Build Raptor OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "Raptor OS Security build successful."

          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          cat raptor-security.sha256

      - name: Upload updated OS
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
