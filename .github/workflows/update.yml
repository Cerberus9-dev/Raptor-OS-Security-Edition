name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raptor-security-update
  cancel-in-progress: true

jobs:
  update:
    name: Rebuild Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show live-build version
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source

          # Keep the repository's archive configuration.
          # Do not generate duplicate archive files here.
          test -f config/archives/base.list.chroot
          test -f config/archives/security.list.chroot

      - name: Validate repository archive files
        working-directory: build
        run: |
          expected_base='deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware'

          expected_security='deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware'

          printf '%s\n' "$expected_base" > /tmp/expected-base.list
          printf '%s\n' "$expected_security" > /tmp/expected-security.list

          diff -u /tmp/expected-base.list config/archives/base.list.chroot
          diff -u /tmp/expected-security.list config/archives/security.list.chroot

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify generated configuration
        working-directory: build
        run: |
          echo "===== base.list.chroot ====="
          cat config/archives/base.list.chroot

          echo
          echo "===== security.list.chroot ====="
          cat config/archives/security.list.chroot

          echo
          echo "===== generated archive configuration ====="
          grep -RniE \
            'deb\.debian\.org/debian|deb\.debian\.org/debian-security|security\.debian\.org|bookworm-updates|bookworm-security|bookworm/updates' \
            config/ \
            2>/dev/null || true

      - name: Reject obsolete security repository
        working-directory: build
        run: |
          if grep -RniE \
            '(^|[[:space:]])(https?://)?(security\.debian\.org|deb\.debian\.org/debian-security)[[:space:]]+bookworm/updates([[:space:]]|$)' \
            config/ \
            2>/dev/null; then
            echo "ERROR: obsolete Debian security suite bookworm/updates detected."
            exit 1
          fi

          echo "OK: no obsolete bookworm/updates repository found."

      - name: Build updated OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi

          echo "Raptor OS Security build succeeded:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
