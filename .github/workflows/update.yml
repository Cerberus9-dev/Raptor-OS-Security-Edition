name: Build Raptor OS Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Raptor OS Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Check for Ubuntu configuration
        run: |
          echo "Checking Security Edition build configuration..."

          if grep -RniE \
            'ubuntu-keyring|security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu/' \
            build/; then
            echo
            echo "ERROR: Ubuntu-specific configuration was found in build/."
            echo "Raptor OS Security must use Debian repositories/packages."
            exit 1
          fi

          echo "No Ubuntu-specific configuration found."

      - name: Show live-build configuration
        working-directory: build
        run: |
          echo "===== build/auto/config ====="
          cat auto/config

      - name: Clean live-build
        working-directory: build
        run: |
          sudo lb clean --purge || true

      - name: Configure live-build
        working-directory: build
        run: bash auto/config

      - name: Build Raptor OS
        working-directory: build
        run: sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "======================================"
          echo "Raptor OS Security build successful"
          echo "======================================"

          echo
          echo "ISO:"
          ls -lh "$ISO"

          echo
          echo "SHA256:"
          sha256sum "$ISO" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload updated OS
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
