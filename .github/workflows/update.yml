name: Build Raptor Security OS

on:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/update.yml"

  pull_request:
    paths:
      - "build/**"
      - ".github/workflows/update.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Raptor Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Configure live-build
        working-directory: build
        run: |
          ./auto/config

      - name: Build OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify build
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: Build completed but no ISO was produced."
            exit 1
          fi

          echo "======================================"
          echo "Raptor OS Security build successful"
          echo "======================================"
          echo
          echo "ISO:"
          ls -lh "$ISO"
          echo
          echo "SHA256:"
          sha256sum "$ISO"
