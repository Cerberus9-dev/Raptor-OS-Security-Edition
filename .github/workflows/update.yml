name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Raptor OS Security Update
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Check repository configuration
        run: |
          echo "===== Checking repository for unwanted Ubuntu references ====="

          if grep -RniE \
            'ubuntu-keyring|security\.ubuntu\.com|archive\.ubuntu\.com' \
            build/ \
            --exclude-dir=.git; then
            echo
            echo "ERROR: Ubuntu-specific configuration was found."
            exit 1
          fi

          echo
          echo "No unwanted Ubuntu references found."

      - name: Show auto config
        working-directory: build
        run: |
          echo "===== build/auto/config ====="
          cat auto/config

      - name: Clean generated live-build state
        working-directory: build
        run: |
          sudo lb clean --purge || true
          rm -rf cache
          rm -rf chroot
          rm -rf binary

      - name: Configure live-build
        working-directory: build
        run: |
          bash auto/config

      - name: Verify live-build configuration
        working-directory: build
        run: |
          echo "===== Searching generated configuration ====="

          grep -RniE \
            'bookworm/updates|security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ \
            --exclude-dir=.git \
            || true

          echo
          echo "===== Live-build configuration files ====="

          find config -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Inspect generated sources configuration
        working-directory: build
        run: |
          echo "===== Relevant generated configuration ====="

          for file in \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/archives/* \
            config/archives/*.*; do

            if [ -f "$file" ]; then
              echo
              echo "----- $file -----"
              grep -nE \
                'security|mirror|bookworm|updates' \
                "$file" \
                || true
            fi
          done

      - name: Build Raptor OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo
          echo "===== Raptor OS Security build successful ====="
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          echo
          echo "===== SHA256 ====="
          cat raptor-security.sha256

      - name: Upload updated OS
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
