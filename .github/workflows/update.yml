name: Build Raptor OS Security Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Build Raptor OS Security Update
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show versions
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            .build

          sudo rm -f \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify repository configuration
        working-directory: build
        run: |
          echo "===== CHROOT ARCHIVES ====="
          for file in config/archives/*.list.chroot; do
            echo "--- $file ---"
            cat "$file"
          done

          echo
          echo "===== BINARY ARCHIVES ====="
          for file in config/archives/*.list.binary; do
            echo "--- $file ---"
            cat "$file"
          done

          echo
          echo "===== SEARCHING FOR OBSOLETE SECURITY SUITE ====="

          if grep -Rni \
            'bookworm/updates' \
            config/ \
            2>/dev/null; then
            echo
            echo "ERROR: obsolete bookworm/updates repository detected."
            exit 1
          fi

          echo "No obsolete bookworm/updates repository found."

      - name: Verify Debian repositories
        working-directory: build
        run: |
          echo "===== DEBIAN REPOSITORIES ====="

          grep -RniE \
            'deb\.debian\.org/debian|deb\.debian\.org/debian-security' \
            config/ \
            2>/dev/null || true

          echo
          echo "===== VERIFYING SECURITY SUITE ====="

          if ! grep -Rni \
            'deb.debian.org/debian-security bookworm-security' \
            config/ \
            2>/dev/null; then
            echo "ERROR: bookworm-security repository is missing."
            exit 1
          fi

          echo "bookworm-security repository is present."

      - name: Verify Ubuntu repositories are absent
        working-directory: build
        run: |
          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ \
            2>/dev/null; then

            echo "ERROR: Ubuntu repository detected."
            exit 1
          fi

          echo "No Ubuntu repositories detected."

      - name: Build Raptor OS
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

          echo "Raptor OS Security build succeeded."

          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          cat raptor-security.sha256

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-Update
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
