name: Build Raptor Security ISO

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Security Edition ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Configure live-build
        working-directory: build
        run: |
          ./auto/config

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Find ISO
        id: iso
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "ISO=$ISO" >> "$GITHUB_OUTPUT"
          echo "Found: $ISO"

      - name: Generate checksum
        working-directory: build
        run: |
          sha256sum "${{ steps.iso.outputs.ISO }}" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
