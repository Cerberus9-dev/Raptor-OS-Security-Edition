name: Build Raptor OS Security Edition

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel previous running builds for the same ref when a new commit is pushed
concurrency:
  group: raptor-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Clean Previous Builds
        run: |
          # Safe clean script execution
          chmod +x ./auto/clean
          ./auto/clean

      - name: Build Raptor OS ISO
        run: |
          # Direct lb build without unbuffered trace debugging
          sudo lb build
