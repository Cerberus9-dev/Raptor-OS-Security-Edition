name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show versions
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous live-build state
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf cache
          sudo rm -rf chroot
          sudo rm -rf binary

          rm -f config/bootstrap
          rm -f config/chroot
          rm -f config/binary
          rm -f config/common
          rm -f config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify Debian repository configuration
        working-directory: build
        run: |
          echo "Checking generated configuration..."

          if grep -Rni 'bookworm/updates' config/ 2>/dev/null; then
            echo "ERROR: Invalid bookworm/updates repository detected."
            exit 1
          fi

          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ 2>/dev/null; then
            echo "ERROR: Ubuntu repository detected."
            exit 1
          fi

          echo "Repository checks passed."

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Locate ISO
        id: iso
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "ISO=$ISO" >> "$GITHUB_OUTPUT"

          ls -lh "$ISO"

      - name: Generate SHA256
        working-directory: build
        run: |
          sha256sum "${{ steps.iso.outputs.ISO }}" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
