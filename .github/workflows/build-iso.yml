name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Verify repository configuration
        run: |
          echo "Checking for accidental Ubuntu repositories..."

          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            build/ \
            --exclude-dir=.git; then

            echo
            echo "ERROR: Ubuntu-specific configuration was found."
            exit 1
          fi

          echo "Repository configuration looks good."

      - name: Clean previous live-build configuration
        working-directory: build
        run: |
          sudo lb clean --purge || true

          rm -rf cache
          rm -rf chroot
          rm -rf binary

          # These are generated by lb config.
          # Keep the project's package lists/hooks/etc.
          rm -f config/bootstrap
          rm -f config/chroot
          rm -f config/binary
          rm -f config/common
          rm -f config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify generated configuration
        working-directory: build
        run: |
          echo "===== Generated configuration ====="

          echo
          echo "----- config/bootstrap -----"
          cat config/bootstrap 2>/dev/null || true

          echo
          echo "----- config/chroot -----"
          cat config/chroot 2>/dev/null || true

          echo
          echo "----- config/binary -----"
          cat config/binary 2>/dev/null || true

          echo
          echo "===== Checking for invalid security suite ====="

          if grep -Rni 'bookworm/updates' config/; then
            echo
            echo "ERROR: live-build generated bookworm/updates."
            exit 1
          fi

          echo
          echo "No bookworm/updates configuration found."

          echo
          echo "===== Checking for Ubuntu repositories ====="

          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/; then

            echo
            echo "ERROR: Ubuntu configuration was generated."
            exit 1
          fi

          echo
          echo "Generated configuration passed checks."

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Find ISO
        id: iso
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "ISO=$ISO" >> "$GITHUB_OUTPUT"

          echo
          echo "===== ISO ====="
          ls -lh "$ISO"

      - name: Generate SHA256
        working-directory: build
        run: |
          sha256sum "${{ steps.iso.outputs.ISO }}" > raptor-security.sha256

          echo
          echo "===== SHA256 ====="
          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
