name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raptor-security-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show build tool versions
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            .build

          sudo rm -f \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source

      - name: Remove stale archive configuration
        working-directory: build
        run: |
          set -e

          # Remove any stale live-build generated archive configuration.
          sudo rm -f \
            config/archives/*.list \
            config/archives/*.list.chroot \
            config/archives/*.list.binary \
            config/archives/*.list.chroot_*

          # Recreate the archive directory.
          mkdir -p config/archives

          # Debian Bookworm base repositories.
          cat > config/archives/base.list.chroot <<'EOF'
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          EOF

          # Current Debian Bookworm security repository.
          cat > config/archives/security.list.chroot <<'EOF'
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          echo "===== base.list.chroot ====="
          cat config/archives/base.list.chroot

          echo
          echo "===== security.list.chroot ====="
          cat config/archives/security.list.chroot

      - name: Configure live-build
        working-directory: build
        run: |
          set -e

          chmod +x auto/config
          ./auto/config

      - name: Force correct generated APT sources
        working-directory: build
        run: |
          set -e

          # Remove obsolete security sources generated by older
          # live-build configurations.
          sudo find config -type f \
            \( -name '*.list' -o -name '*.list.chroot' -o -name '*.list.binary' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            sudo sed -i \
              -e '/security\.debian\.org.*bookworm\/updates/d' \
              -e '/deb\.debian\.org\/debian-security.*bookworm\/updates/d' \
              "$file"
          done

          echo "===== All archive configuration ====="
          find config/archives -type f -maxdepth 1 -print -exec cat {} \;

          echo
          echo "===== Searching for obsolete security entries ====="

          if grep -RniE \
            'security\.debian\.org|bookworm/updates' \
            config/ \
            2>/dev/null; then
            echo "ERROR: obsolete Debian security repository found."
            exit 1
          fi

          echo "No obsolete security repository references found."

      - name: Fix live-build Contents index lookup
        working-directory: build
        run: |
          set -e

          LB_FILE="/usr/lib/live/build/lb_chroot_linux-image"

          if [ ! -f "$LB_FILE" ]; then
            echo "ERROR: $LB_FILE was not found."
            exit 1
          fi

          echo "===== live-build Contents lookup before patch ====="
          sudo grep -n "Contents-" "$LB_FILE" || true

          sudo cp "$LB_FILE" "${LB_FILE}.raptor-backup"

          # Old live-build asks for:
          #
          #   dists/bookworm/Contents-amd64.gz
          #
          # Debian Bookworm stores the component index at:
          #
          #   dists/bookworm/main/Contents-amd64.gz
          #
          sudo sed -i \
            's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

          sudo sed -i \
            's#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}\.gz#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

          echo "===== live-build Contents lookup after patch ====="
          sudo grep -n "Contents-" "$LB_FILE" || true

      - name: Verify APT configuration
        working-directory: build
        run: |
          set -e

          echo "===== build/config/archives ====="
          find config/archives -maxdepth 1 -type f -print -exec cat {} \;

          echo
          echo "===== Searching entire build configuration ====="

          if grep -RniE \
            'security\.debian\.org|bookworm/updates' \
            config/ \
            2>/dev/null; then
            echo
            echo "ERROR: obsolete security repository reference remains."
            exit 1
          fi

          echo "APT configuration is clean."

      - name: Build ISO
        working-directory: build
        run: |
          set -e

          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          set -e

          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi

          echo "ISO successfully built:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
