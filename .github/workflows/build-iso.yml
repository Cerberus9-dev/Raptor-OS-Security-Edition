name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file \
            gnupg

      - name: Clean and Reset Build Directory
        run: |
          cd build
          sudo lb clean --purge
          sudo rm -rf .live* config.d cache chroot .build .lock
          rm -rf config
          mkdir -p config/archives config/package-lists config/hooks config/includes.chroot

      - name: Create Fresh Config
        run: |
          cd build
          
          # Create package list
          cat > config/package-lists/standard.list.chroot << 'PKGEOF'
          # Base System, Desktop Environment & Display Manager
          task-desktop
          xfce4
          xfce4-goodies
          lightdm
          network-manager-gnome
          sudo
          curl
          wget
          git
          zsh
          rfkill
          
          # Hardware, Firmware & Audio Drivers
          firmware-linux
          firmware-linux-nonfree
          firmware-iwlwifi
          firmware-realtek
          bluetooth
          bluez
          pulseaudio
          pavucontrol
          
          # Primary Web Browser & Media
          librewolf
          vlc
          gimp
          flameshot
          
          # Tor & Anonymity Engine
          tor
          torbrowser-launcher
          nyx
          netcat-openbsd
          
          # VPN & Network Routing
          openvpn
          wireguard
          wireguard-tools
          network-manager
          network-manager-openvpn
          network-manager-openvpn-gnome
          
          # System Hardening, Privacy & Anti-Forensics
          macchanger
          secure-delete
          resolvconf
          nftables
          iptables
          
          # GTK Dashboard & Control Center Dependencies
          policykit-1
          python3
          python3-pip
          python3-gi
          python3-tk
          gir1.2-gtk-3.0
          
          # Security Auditing, Forensics & Reconnaissance
          nmap
          wireshark
          tcpdump
          aircrack-ng
          hydra
          john
          hashcat
          sqlmap
          chkrootkit
          rkhunter
          autopsy
          PKGEOF
          
          # Create LibreWolf repo (HTTP only to avoid cert issues)
          cat > config/archives/librewolf.list.chroot << 'REPOEOF'
          deb http://deb.librewolf.net bookworm main
          REPOEOF
          
          cat > config/archives/librewolf.list.binary << 'REPOEOF'
          deb http://deb.librewolf.net bookworm main
          REPOEOF

      - name: Build ISO - Debian Bookworm
        run: |
          cd build
          
          echo "=== Configuring live-build for Debian ==="
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --apt apt \
            --apt-indices false \
            --apt-source-archives false \
            --security false \
            --verbose
          
          echo ""
          echo "=== Starting ISO build ==="
          sudo lb build --verbose 2>&1 | tee build.log
          BUILD_EXIT=$?
          
          echo ""
          echo "Build exit code: $BUILD_EXIT"
          echo ""
          
          # Check if ISO was created regardless of exit code
          if ls *.iso 2>/dev/null | grep -q .; then
            echo "SUCCESS: ISO file found"
            ls -lah *.iso
            exit 0
          else
            echo "FAILED: No ISO file created"
            echo ""
            echo "=== Last 300 lines of build.log ==="
            tail -300 build.log
            exit 1
          fi

      - name: Prepare Artifacts
        if: success()
        run: |
          cd build
          ISO_FILE=$(ls *.iso 2>/dev/null | head -1)
          
          if [ -z "$ISO_FILE" ]; then
            echo "No ISO found"
            exit 1
          fi
          
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          mv "$ISO_FILE" "$FINAL_NAME"
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
          ls -lah *.iso*

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.sha256

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build/build.log
