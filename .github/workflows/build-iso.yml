name: Build Raptor Security Edition ISO
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3 coreutils file gnupg
      - name: Prepare Build
        run: |
          cd build
          sudo lb clean --purge 2>/dev/null || true
          sudo rm -rf config .live* cache chroot .lock .build 2>/dev/null || true
          mkdir -p config/{archives,package-lists,hooks,includes.chroot,apt}

          cat > config/apt/apt.conf << 'EOF'
          Acquire::https::Verify-Peer "false";
          Acquire::https::Verify-Host "false";
          EOF

          cat > config/package-lists/security.list.chroot << 'EOF'
          linux-image-amd64
          task-desktop
          xfce4
          xfce4-goodies
          lightdm
          network-manager-gnome
          calamares
          calamares-settings-debian
          sudo
          curl
          wget
          git
          zsh
          rfkill
          firmware-linux
          firmware-linux-nonfree
          firmware-iwlwifi
          firmware-realtek
          bluetooth
          bluez
          pulseaudio
          pavucontrol
          librewolf
          vlc
          gimp
          flameshot
          tor
          torbrowser-launcher
          nyx
          netcat-openbsd
          openvpn
          wireguard
          wireguard-tools
          network-manager
          network-manager-openvpn
          network-manager-openvpn-gnome
          macchanger
          secure-delete
          resolvconf
          nftables
          iptables
          policykit-1
          python3
          python3-pip
          python3-gi
          python3-tk
          gir1.2-gtk-3.0
          nmap
          wireshark
          tcpdump
          aircrack-ng
          hydra
          john
          hashcat
          sqlmap
          chkrootkit
          rkhunter
          autopsy
          EOF

          cat > config/archives/librewolf.list.chroot << 'EOF'
          deb [trusted=yes] http://repo.librewolf.net librewolf main
          EOF
          cat > config/archives/librewolf.list.binary << 'EOF'
          deb [trusted=yes] http://repo.librewolf.net librewolf main
          EOF

          cat > config/archives/backports.list.chroot << 'EOF'
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
          cat > config/archives/backports.list.binary << 'EOF'
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
      - name: Build ISO
        run: |
          cd build

          echo "=== Configuring ==="
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --linux-packages none \
            --binary-images iso \
            --iso-application "Raptor Security Edition" \
            --iso-publisher "Raptor OS" \
            --iso-volume "RAPTOR-SEC" \
            --bootloader isolinux \
            --apt-recommends false \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --apt apt \
            --apt-indices false \
            --security false

          echo "=== Building ==="
          sudo lb build 2>&1 | tee build.log

          echo ""
          echo "=== Searching for output ==="
          find . -maxdepth 2 -type f -name "*.iso" 2>/dev/null

          ISO_FILE=$(find . -maxdepth 2 -type f -name "*.iso" | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            sudo cp "$ISO_FILE" raptor-security.iso
            sudo chmod 644 raptor-security.iso
            echo "ISO copied successfully: $ISO_FILE"
          else
            echo "ERROR: No ISO file created"
            tail -200 build.log
            exit 1
          fi
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: build/raptor-security.iso
      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build/build.log
