name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show versions
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf cache
          sudo rm -rf chroot
          sudo rm -rf binary

          rm -f config/bootstrap
          rm -f config/chroot
          rm -f config/binary
          rm -f config/common
          rm -f config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Fix generated security repository
        working-directory: build
        run: |
          echo "Searching generated live-build configuration..."

          grep -Rni \
            'bookworm/updates' \
            config/ \
            2>/dev/null || true

          echo
          echo "Replacing obsolete Bookworm security suite..."

          find config -type f -print0 | while IFS= read -r -d '' file; do
            if grep -q 'bookworm/updates' "$file" 2>/dev/null; then
              echo "Fixing $file"
              sed -i 's/bookworm\/updates/bookworm-security/g' "$file"
            fi
          done

          echo
          echo "Checking result..."

          if grep -Rni \
            'bookworm/updates' \
            config/ \
            2>/dev/null; then

            echo "ERROR: bookworm/updates still exists."
            exit 1
          fi

          echo "Security repository fixed."

      - name: Verify Ubuntu repositories are absent
        working-directory: build
        run: |
          if grep -RniE \
            'security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ \
            2>/dev/null; then

            echo "ERROR: Ubuntu repository detected."
            exit 1
          fi

          echo "No Ubuntu repositories detected."

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Find ISO
        id: iso
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

          echo "ISO=$ISO" >> "$GITHUB_OUTPUT"

          ls -lh "$ISO"

      - name: Generate checksum
        working-directory: build
        run: |
          sha256sum "${{ steps.iso.outputs.ISO }}" > raptor-security.sha256
          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
