name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raptor-security-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show live-build version
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary \
            .build

          sudo rm -f \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Fix live-build Contents index lookup
        working-directory: build
        run: |
          set -e

          LB_FILE="/usr/lib/live/build/lb_chroot_linux-image"

          echo "Checking live-build implementation..."

          if [ ! -f "$LB_FILE" ]; then
            echo "ERROR: $LB_FILE was not found."
            exit 1
          fi

          sudo cp "$LB_FILE" "${LB_FILE}.raptor-backup"

          echo "Before patch:"
          sudo grep -n "Contents-" "$LB_FILE" || true

          # Debian Bookworm no longer provides the old top-level
          # dists/bookworm/Contents-amd64.gz location.
          #
          # live-build on the GitHub runner can still request it,
          # so redirect the lookup to the component Contents index.

          sudo sed -i \
            's#\${LB_PARENT_MIRROR_CHROOT}/dists/\${LB_PARENT_DISTRIBUTION}/Contents-\${LB_ARCHITECTURES}\.gz#\${LB_PARENT_MIRROR_CHROOT}/dists/\${LB_PARENT_DISTRIBUTION}/main/Contents-\${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

          sudo sed -i \
            's#\${LB_MIRROR_CHROOT}/dists/\${LB_DISTRIBUTION}/Contents-\${LB_ARCHITECTURES}\.gz#\${LB_MIRROR_CHROOT}/dists/\${LB_DISTRIBUTION}/main/Contents-\${LB_ARCHITECTURES}.gz#g' \
            "$LB_FILE"

          echo "After patch:"
          sudo grep -n "Contents-" "$LB_FILE" || true

      - name: Remove duplicate generated APT sources
        working-directory: build
        run: |
          set -e

          echo "Checking generated APT sources..."

          if [ -f config/archives/base.list.chroot ]; then
            echo "===== base.list.chroot ====="
            cat config/archives/base.list.chroot
          fi

          if [ -f config/archives/security.list.chroot ]; then
            echo "===== security.list.chroot ====="
            cat config/archives/security.list.chroot
          fi

          echo "===== generated config ====="
          find config -type f -maxdepth 3 -print | sort

          echo
          echo "===== searching for obsolete security entries ====="

          if grep -RniE \
            'security\.debian\.org|bookworm/updates' \
            config/ \
            2>/dev/null; then
            echo
            echo "ERROR: obsolete Debian security repository reference found."
            exit 1
          fi

          echo "No obsolete security repository references found."

      - name: Verify archive configuration
        working-directory: build
        run: |
          set -e

          echo "===== base.list.chroot ====="
          cat config/archives/base.list.chroot

          echo
          echo "===== security.list.chroot ====="
          cat config/archives/security.list.chroot

          echo
          echo "===== generated live-build configuration ====="

          grep -RniE \
            'deb\.debian\.org|bookworm-security|bookworm/updates|security\.debian\.org' \
            config/ \
            2>/dev/null || true

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi

          echo "ISO successfully built:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
