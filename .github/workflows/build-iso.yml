name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            git

      - name: Check build configuration
        run: |
          echo "===== Checking for unwanted Ubuntu configuration ====="

          if grep -RniE \
            'ubuntu-keyring|security\.ubuntu\.com|archive\.ubuntu\.com' \
            build/ \
            --exclude-dir=.git; then
            echo
            echo "ERROR: Ubuntu-specific configuration was found."
            exit 1
          fi

          echo "No unwanted Ubuntu configuration found."

      - name: Show auto config
        working-directory: build
        run: |
          echo "===== build/auto/config ====="
          cat auto/config

      - name: Clean generated live-build state
        working-directory: build
        run: |
          sudo lb clean --purge || true
          rm -rf cache
          rm -rf chroot
          rm -rf binary

      - name: Configure live-build
        working-directory: build
        run: |
          bash auto/config

      - name: Show generated live-build configuration
        working-directory: build
        run: |
          echo "===== Generated live-build configuration ====="

          find config -maxdepth 2 -type f -print 2>/dev/null || true

          echo
          echo "===== Searching for bad security repository ====="

          grep -RniE \
            'debian-security|bookworm/updates|security\.ubuntu\.com|archive\.ubuntu\.com|ubuntu-keyring' \
            config/ \
            --exclude-dir=.git \
            || true

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Find ISO
        id: iso
        working-directory: build
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was produced."
            exit 1
          fi

          echo "ISO=$ISO" >> "$GITHUB_OUTPUT"

          echo "===== ISO ====="
          ls -lh "$ISO"

      - name: Generate SHA256
        working-directory: build
        run: |
          sha256sum "${{ steps.iso.outputs.ISO }}" > raptor-security.sha256

          echo "===== SHA256 ====="
          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
