name: Raptor OS ISO Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validate and Build Raptor OS ISO
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            gdisk \
            xorriso \
            file \
            python3 \
            bash \
            ca-certificates \
            wget \
            git

      - name: Auto-Fix Permissions & Normalize Filenames
        run: |
          # Normalize filenames with spaces in hooks directory
          for file in build/config/hooks/live/*\ *; do
            if [ -f "$file" ]; then
              newfile=$(echo "$file" | tr ' ' '-')
              mv "$file" "$newfile"
              echo "Normalized: '$file' -> '$newfile'"
            fi
          done

          # Force executable permissions across all scripts
          chmod -R +x build/config/includes.chroot/usr/local/bin/ || true
          chmod -R +x build/config/hooks/live/ || true
          chmod -R +x build/scripts/ || true

      - name: Fetch Third-Party Repository GPG Keys
        run: |
          mkdir -p build/config/archives
          wget -O build/config/archives/librewolf.key.chroot https://deb.librewolf.net/keyring.gpg

      - name: Run Pre-Build Validation
        run: |
          ./build/scripts/validate.sh

      - name: Clean & Configure live-build
        run: |
          cd build
          lb clean --purge
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer live \
            --bootloader syslinux \
            --iso-application "Raptor OS Security Edition" \
            --iso-volume "RAPTOR_OS_DEV"

      - name: Execute ISO Build
        run: |
          cd build
          lb build 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-os-build-log
          path: build/build.log
          retention-days: 7

      - name: Generate SHA-256 Checksum
        run: |
          cd build
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso raptor-os-security-amd64.iso
            sha256sum raptor-os-security-amd64.iso > raptor-os-security-amd64.iso.sha256
          else
            echo "::error::ISO file generation failed! Check build.log artifact for live-build errors."
            exit 1
          fi

      - name: Upload Actions Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-os-security-iso
          path: |
            build/raptor-os-security-amd64.iso
            build/raptor-os-security-amd64.iso.sha256
          retention-days: 7

      - name: Publish Raw Uncompressed ISO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/raptor-os-security-amd64.iso
            build/raptor-os-security-amd64.iso.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
