name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file \
            gnupg

      - name: Clean Build Directory
        run: |
          cd build
          sudo lb clean --purge 2>/dev/null || true
          rm -rf cache/ chroot/ .build/ .lock 2>/dev/null || true
          ls -la

      - name: Fix Package Lists
        run: |
          grep -rln "^dnscrypt-proxy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^dnscrypt-proxy$/d' "$f"
          done
          grep -rln "^scrcpy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^scrcpy$/d' "$f"
          done
          grep -rln "^librewolf$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^librewolf$/d' "$f"
          done

      - name: Build ISO - Debian Bookworm
        run: |
          cd build
          
          echo "=== Cleaning previous build ==="
          sudo lb clean --purge
          
          echo "=== Configuring live-build ==="
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --parent-distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --apt-recommends false \
            --apt-indices false \
            --apt-source-archives false \
            --security false
          
          echo "=== Building ISO ==="
          sudo lb build 2>&1 | tee build.log
          
          echo "=== Checking results ==="
          ls -lah *.iso* 2>/dev/null || echo "No ISO created"

      - name: Check Build Success
        run: |
          cd build
          if [ -f *.iso ]; then
            echo "ISO build successful"
            ls -lah *.iso
          else
            echo "ISO build failed"
            tail -100 build.log
            exit 1
          fi

      - name: Prepare Artifact
        if: success()
        run: |
          cd build
          ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "No ISO file found"
            exit 1
          fi
          
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          mv "$ISO_FILE" "$FINAL_NAME"
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
          ls -lah *.iso*

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: build/*.iso*

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build/build.log
