name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3 coreutils file gnupg

      - name: Prepare Build
        run: |
          cd build
          sudo lb clean --purge 2>/dev/null || true
          sudo rm -rf config .live* cache chroot .lock .build 2>/dev/null || true
          mkdir -p config/{archives,package-lists,hooks,includes.chroot}
          
          cat > config/package-lists/standard.list.chroot << 'EOF'
          task-desktop
          xfce4
          xfce4-goodies
          lightdm
          network-manager-gnome
          sudo
          curl
          wget
          git
          zsh
          librewolf
          vlc
          gimp
          tor
          torbrowser-launcher
          openvpn
          wireguard
          macchanger
          nmap
          wireshark
          tcpdump
          aircrack-ng
          hydra
          john
          hashcat
          sqlmap
          chkrootkit
          rkhunter
          autopsy
          EOF
          
          cat > config/archives/librewolf.list.chroot << 'EOF'
          deb http://deb.librewolf.net bookworm main
          EOF
          cat > config/archives/librewolf.list.binary << 'EOF'
          deb http://deb.librewolf.net bookworm main
          EOF

      - name: Build ISO
        run: |
          cd build
          
          echo "=== Configuring ==="
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --binary-images iso \
            --iso-application "Raptor Security Edition" \
            --iso-publisher "Raptor OS" \
            --iso-volume "RAPTOR-SEC" \
            --bootloader isolinux \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --apt apt \
            --apt-indices false \
            --security false
          
          echo "=== Building ==="
          sudo lb build 2>&1 | tee build.log
          
          echo ""
          echo "=== Searching for output ==="
          find . -type f \( -name "*.iso" -o -name "live-image*" \) 2>/dev/null | head -20
          
          ls -lah . | grep -E "iso|live" || echo "No ISO files in current dir"
          
          # Check all subdirs
          find . -maxdepth 2 -type f -name "*.iso" 2>/dev/null
          
          if [ -f *.iso ] 2>/dev/null; then
            cp *.iso raptor-security.iso
            echo "ISO copied successfully"
          else
            echo "ERROR: No ISO file created"
            tail -200 build.log
            exit 1
          fi

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: build/raptor-security.iso
