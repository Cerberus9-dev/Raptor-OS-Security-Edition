name: Build Raptor OS Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Runner Disk Space
        run: |
          echo "=== Host Runner Disk Status ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            debian-archive-keyring \
            syslinux \
            syslinux-utils \
            isolinux \
            mtools \
            dosfstools \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            po4a

      - name: Set Shell Script Executable Permissions
        run: |
          chmod +x auto/config auto/build auto/clean

      - name: Clean Previous Build Cache
        run: |
          sudo lb clean --purge
          sudo rm -rf .build config/binary config/bootstrap config/chroot config/common config/source

      - name: Configure Live-Build
        run: |
          sudo lb config

      - name: Execute Live-Build ISO Compilation
        run: |
          sudo DEBIAN_FRONTEND=noninteractive lb build 2>&1 | tee build.log

      - name: Verify ISO Artifact Output
        id: verify
        run: |
          ISO_FILE=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file generated by live-build!"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$ISO_FILE")
          if [ "$SIZE" -le 104857600 ]; then
            echo "ERROR: Generated ISO is smaller than 100MB ($SIZE bytes). Build incomplete."
            exit 1
          fi

          echo "ISO_PATH=$ISO_FILE" >> $GITHUB_ENV
          echo "ISO_NAME=$(basename $ISO_FILE)" >> $GITHUB_ENV
          echo "=== ISO BUILD VERIFIED ==="
          echo "Path: $ISO_FILE"
          echo "Size: $(du -h "$ISO_FILE" | cut -f1)"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: ${{ env.ISO_PATH }}
          if-no-files-found: error
          retention-days: 7
