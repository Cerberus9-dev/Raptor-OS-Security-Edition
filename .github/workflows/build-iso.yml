name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -E -i 's#https?://archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -E -i 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5 \
            -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Acquire::ForceIPv4=true \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file

      - name: Fix Ubuntu-only / unavailable package references
        run: |
          echo "--- ubuntu-keyring -> debian-archive-keyring ---"
          grep -rn "ubuntu-keyring" . --exclude-dir=.git 2>/dev/null || echo "(none found)"
          FOUND=$(grep -rl "ubuntu-keyring" . --exclude-dir=.git 2>/dev/null || true)
          [ -n "$FOUND" ] && echo "$FOUND" | xargs sed -i 's/\bubuntu-keyring\b/debian-archive-keyring/g'

          echo "--- linux-generic -> linux-image-amd64 (Ubuntu meta-kernel name doesn't exist in Debian) ---"
          grep -rn "linux-generic" . --exclude-dir=.git 2>/dev/null || echo "(none found)"
          FOUND=$(grep -rl "linux-generic" . --exclude-dir=.git 2>/dev/null || true)
          [ -n "$FOUND" ] && echo "$FOUND" | xargs sed -i 's/\blinux-generic\b/linux-image-amd64/g'

          echo "--- dnscrypt-proxy: removed from Debian bookworm entirely, dropping from package lists ---"
          grep -rln "^dnscrypt-proxy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^dnscrypt-proxy$/d' "$f"
            echo "removed from: $f"
          done

          echo "--- scrcpy: removed from Debian bookworm entirely, dropping from package lists ---"
          grep -rln "^scrcpy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^scrcpy$/d' "$f"
            echo "removed from: $f"
          done

      - name: Configure LibreWolf Repo
        run: |
          mkdir -p build/config/archives
          cat << 'EOF' > build/config/archives/librewolf.list.chroot
          deb [trusted=yes] http://repo.librewolf.net librewolf main
          EOF
          cat << 'EOF' > build/config/archives/librewolf.list.binary
          deb [trusted=yes] http://repo.librewolf.net librewolf main
          EOF
          cat << 'EOF' > build/config/archives/backports.list.chroot
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
          cat << 'EOF' > build/config/archives/backports.list.binary
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF

      - name: Run Validation Check
        run: |
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh

      - name: Build ISO
        run: |
          cd build
          sudo lb clean --purge
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --apt-recommends false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --security true
          sudo lb build 2>&1 | sudo tee build.log

      - name: Prepare Artifact
        if: success()
        run: |
          cd build
          GENERATED_ISO=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$GENERATED_ISO" ]; then
            echo "[ERROR] ISO generation failed: No .iso file created."
            exit 1
          fi
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          mv "$GENERATED_ISO" "$FINAL_NAME"
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.sha256

      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build/build.log
