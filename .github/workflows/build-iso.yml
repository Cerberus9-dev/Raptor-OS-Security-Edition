name: Build Raptor OS Security ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raptor-security-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Raptor OS Security ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync

      - name: Show live-build version
        run: |
          lb --version
          debootstrap --version

      - name: Clean previous build
        working-directory: build
        run: |
          sudo lb clean --purge || true

          sudo rm -rf \
            cache \
            chroot \
            binary

          sudo rm -f \
            config/bootstrap \
            config/chroot \
            config/binary \
            config/common \
            config/source

      - name: Configure live-build
        working-directory: build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Verify archive configuration
        working-directory: build
        run: |
          echo "===== base.list.chroot ====="
          cat config/archives/base.list.chroot

          echo
          echo "===== security.list.chroot ====="
          cat config/archives/security.list.chroot

          echo
          echo "===== generated config ====="
          grep -RniE \
            'security\.debian\.org|bookworm/updates|bookworm-security' \
            config/ \
            2>/dev/null || true

      - name: Verify no obsolete security repository exists
        working-directory: build
        run: |
          if grep -RniE \
            'security\.debian\.org.*bookworm/updates|security\.debian\.org bookworm/updates' \
            config/ \
            2>/dev/null; then

            echo "ERROR: obsolete bookworm/updates security repository found."
            exit 1
          fi

          echo "No obsolete security repository found."

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build

      - name: Verify ISO
        working-directory: build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build completed but no ISO was produced."
            exit 1
          fi

          echo "ISO successfully built:"
          ls -lh "$ISO"

          sha256sum "$ISO" > raptor-security.sha256

          cat raptor-security.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-OS-Security-ISO
          path: |
            build/*.iso
            build/raptor-security.sha256
          compression-level: 0
          retention-days: 30
