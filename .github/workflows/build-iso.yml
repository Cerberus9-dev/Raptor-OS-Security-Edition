name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3 coreutils file gnupg

      - name: Prepare Build
        run: |
          cd build
          sudo lb clean --purge 2>/dev/null || true
          sudo rm -rf config .live* cache chroot .lock .build 2>/dev/null || true
          mkdir -p config/{archives,package-lists,hooks,includes.chroot}
          
          # Minimal package list
          cat > config/package-lists/standard.list.chroot << 'EOF'
          task-desktop
          xfce4
          xfce4-goodies
          lightdm
          network-manager-gnome
          sudo
          curl
          wget
          git
          zsh
          librewolf
          vlc
          gimp
          tor
          torbrowser-launcher
          openvpn
          wireguard
          macchanger
          nmap
          wireshark
          tcpdump
          aircrack-ng
          hydra
          john
          hashcat
          sqlmap
          chkrootkit
          rkhunter
          autopsy
          EOF
          
          # LibreWolf repo
          cat > config/archives/librewolf.list.chroot << 'EOF'
          deb http://deb.librewolf.net bookworm main
          EOF
          cat > config/archives/librewolf.list.binary << 'EOF'
          deb http://deb.librewolf.net bookworm main
          EOF

      - name: Build
        run: |
          cd build
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --apt apt \
            --apt-indices false \
            --security false
          
          sudo lb build 2>&1 | tail -50
          
          # Find the ISO regardless
          ISO=$(find . -name "*.iso" -type f 2>/dev/null | head -1)
          if [ -n "$ISO" ]; then
            echo "SUCCESS: $ISO"
            ls -lh "$ISO"
            cp "$ISO" raptor-security.iso
          else
            echo "FAILED: No ISO found"
            exit 1
          fi

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: build/raptor-security.iso
