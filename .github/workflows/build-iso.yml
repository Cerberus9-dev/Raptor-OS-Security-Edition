name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -E -i 's#https?://archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -E -i 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5 \
            -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Acquire::ForceIPv4=true \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file \
            debian-archive-keyring \
            ca-certificates \
            gnupg \
            curl

      - name: Configure LibreWolf Repo
        run: |
          mkdir -p build/config/archives
          mkdir -p build/config/package-lists
          mkdir -p build/config/includes.chroot/etc/apt/apt.conf.d

          cat << 'EOF' > build/config/archives/librewolf.list.chroot
          deb [trusted=yes] https://deb.librewolf.net bookworm main
          EOF

          cat << 'EOF' > build/config/archives/librewolf.list.binary
          deb [trusted=yes] https://deb.librewolf.net bookworm main
          EOF

          echo "ca-certificates" >> build/config/package-lists/raptor-security.list.chroot

          # Belt-and-braces: still skip cert verification for anything that
          # runs before the includes/bootstrap packages are fully settled.
          cat << 'EOF' > build/config/includes.chroot/etc/apt/apt.conf.d/99no-cert-check
          Acquire::https::Verify-Peer "false";
          Acquire::https::Verify-Host "false";
          EOF

          mkdir -p build/config/hooks/live
          cat << 'EOF' > build/config/hooks/live/9999-restore-cert-check.hook.chroot
          #!/bin/sh
          set -e
          rm -f /etc/apt/apt.conf.d/99no-cert-check
          EOF
          chmod +x build/config/hooks/live/9999-restore-cert-check.hook.chroot

          # live-build on this Ubuntu image doesn't know bookworm's security
          # suite name and generates the old-style "bookworm/updates" path,
          # which 404s. Disable its auto security repo (--security false in
          # lb config below) and provide the correct suite manually instead.
          cat << 'EOF' > build/config/archives/debian-security.list.chroot
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          cat << 'EOF' > build/config/archives/debian-security.list.binary
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

      - name: Run Validation Check
        run: |
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh

      - name: Build ISO
        run: |
          cd build
          touch build.log

          # Ubuntu's debian-archive-keyring package lags behind Debian's
          # current signing keys, causing "Release signed by unknown key"
          # during debootstrap. Overwrite the default keyring file
          # debootstrap actually reads with current keys from Debian.
          curl -fsSL https://ftp-master.debian.org/keys/archive-key-12.asc -o /tmp/bookworm.asc
          curl -fsSL https://ftp-master.debian.org/keys/archive-key-12-security.asc -o /tmp/bookworm-security.asc
          cat /tmp/bookworm.asc /tmp/bookworm-security.asc | gpg --dearmor | sudo tee /usr/share/keyrings/debian-archive-keyring.gpg > /dev/null

          sudo lb clean --purge 2>&1 | sudo tee -a build.log
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --bootstrap-includes "ca-certificates" \
            --security false 2>&1 | sudo tee -a build.log
          sudo lb build 2>&1 | sudo tee -a build.log

      - name: Prepare Artifact
        if: success()
        run: |
          cd build
          GENERATED_ISO=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$GENERATED_ISO" ]; then
            echo "[ERROR] ISO generation failed: No .iso file created."
            exit 1
          fi
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          sudo mv "$GENERATED_ISO" "$FINAL_NAME"
          sudo sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.sha256

      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build/build.log
          if-no-files-found: warn
