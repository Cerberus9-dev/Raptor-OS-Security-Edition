name: Build Raptor Security Edition ISO
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -E -i 's#https?://archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -E -i 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5 \
            -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Acquire::ForceIPv4=true \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file
      - name: Configure LibreWolf Repo
        run: |
          mkdir -p build/config/archives
          cat << 'EOF' > build/config/archives/librewolf.list.chroot
          deb [trusted=yes] https://deb.librewolf.net bookworm main
          EOF
          cat << 'EOF' > build/config/archives/librewolf.list.binary
          deb [trusted=yes] https://deb.librewolf.net bookworm main
          EOF
      - name: Run Validation Check
        run: |
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh
      - name: Build ISO
        run: |
          cd build
          sudo lb clean --purge
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --debootstrap-options="--include=ca-certificates" \
            --security true
          sudo lb build 2>&1 | sudo tee build.log
      - name: Prepare Artifact
        if: success()
        run: |
          cd build
          GENERATED_ISO=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$GENERATED_ISO" ]; then
            echo "[ERROR] ISO generation failed: No .iso file created."
            exit 1
          fi
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          sudo mv "$GENERATED_ISO" "$FINAL_NAME"
          sudo sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.sha256
      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build/build.log
