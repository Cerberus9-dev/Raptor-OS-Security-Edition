name: Build Raptor Security Edition ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-security-iso:
    name: Build Raptor Security ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install CA Certificates First
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=5
          sudo apt-get install -y ca-certificates curl

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -E -i 's#https?://archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -E -i 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=5
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Acquire::ForceIPv4=true \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            python3 \
            coreutils \
            file \
            gnupg

      - name: Disable Problematic LibreWolf Repository
        run: |
          echo "--- Temporarily removing LibreWolf repository due to certificate issues ---"
          sudo rm -f /etc/apt/sources.list.d/*librewolf* 2>/dev/null || true
          if [ -f build/config/archives/librewolf.list.chroot ]; then
            echo "# LibreWolf repository disabled - certificate verification failing" > build/config/archives/librewolf.list.chroot
          fi
          if [ -f build/config/archives/librewolf.list.binary ]; then
            echo "# LibreWolf repository disabled - certificate verification failing" > build/config/archives/librewolf.list.binary
          fi

      - name: Fix Ubuntu-only / unavailable package references
        run: |
          echo "--- dnscrypt-proxy: removed from Debian bookworm entirely, dropping from package lists ---"
          grep -rln "^dnscrypt-proxy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^dnscrypt-proxy$/d' "$f"
            echo "removed from: $f"
          done

          echo "--- scrcpy: removed from Debian bookworm entirely, dropping from package lists ---"
          grep -rln "^scrcpy$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^scrcpy$/d' "$f"
            echo "removed from: $f"
          done

          echo "--- librewolf: removing due to certificate verification issues ---"
          grep -rln "^librewolf$" build/config/package-lists/ 2>/dev/null | while read -r f; do
            sed -i '/^librewolf$/d' "$f"
            echo "removed from: $f"
          done

      - name: Configure Backports & Security Repos
        run: |
          mkdir -p build/config/archives
          cat << 'EOF' > build/config/archives/backports.list.chroot
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF
          cat << 'EOF' > build/config/archives/backports.list.binary
          deb http://deb.debian.org/debian bookworm-backports main contrib non-free non-free-firmware
          EOF

          cat << 'EOF' > build/config/archives/security.list.chroot
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          cat << 'EOF' > build/config/archives/security.list.binary
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          # Disable librewolf repo files
          cat << 'EOF' > build/config/archives/librewolf.list.chroot
          # LibreWolf repository disabled - certificate verification failing
          # Re-enable when TLS certificate issues are resolved
          EOF
          cat << 'EOF' > build/config/archives/librewolf.list.binary
          # LibreWolf repository disabled - certificate verification failing
          # Re-enable when TLS certificate issues are resolved
          EOF

      - name: Configure APT to Skip Contents Files
        run: |
          mkdir -p build/config/apt
          cat << 'EOF' > build/config/apt/apt.conf.d/99-disable-contents
          # Disable Contents file downloads to avoid 404 errors
          APT::Acquire::AllowInsecureRepositories "false";
          APT::Acquire::AllowDowngradeToInsecureRepositories "false";
          Acquire::AllowReleaseInfoChange::Suite "true";
          Acquire::AllowReleaseInfoChange::Version "true";
          Acquire::AllowReleaseInfoChange::Origin "true";
          Acquire::AllowReleaseInfoChange::Label "true";
          APT::Get::AllowUnauthenticated "false";
          Aptitude::ProblemResolver::SolutionCount "10000";
          EOF

      - name: Run Validation Check
        run: |
          chmod +x build/scripts/validate.sh
          ./build/scripts/validate.sh || true

      - name: Build ISO with Retry Logic
        run: |
          cd build
          
          # Maximum number of retry attempts
          MAX_ATTEMPTS=3
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "=========================================="
            echo "ISO Build Attempt $ATTEMPT of $MAX_ATTEMPTS"
            echo "=========================================="
            
            # Clean environment before each attempt
            sudo lb clean --purge 2>/dev/null || true
            
            # Configure live-build with optimizations to skip problematic downloads
            sudo lb config \
              --mode debian \
              --distribution bookworm \
              --architectures amd64 \
              --linux-flavours amd64 \
              --linux-packages linux-image \
              --apt-recommends false \
              --archive-areas "main contrib non-free non-free-firmware" \
              --mirror-bootstrap "http://deb.debian.org/debian/" \
              --mirror-chroot "http://deb.debian.org/debian/" \
              --mirror-binary "http://deb.debian.org/debian/" \
              --mirror-chroot-security "http://deb.debian.org/debian-security/" \
              --mirror-binary-security "http://deb.debian.org/debian-security/" \
              --security false \
              --apt-indices false \
              --apt-source-archives false
            
            echo "=== Starting ISO build ==="
            
            # Run build with error handling
            if sudo lb build 2>&1 | sudo tee build.log; then
              echo "=== Build successful ==="
              echo "=== Checking for ISO artifacts ==="
              ls -lah . | grep -E "\.(iso|log)$" || echo "No artifacts found yet"
              break
            else
              BUILD_EXIT_CODE=$?
              echo "Build failed with exit code: $BUILD_EXIT_CODE"
              
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Retrying in 5 seconds..."
                sleep 5
              else
                echo "All attempts failed. Showing last 150 lines of build.log:"
                tail -150 build.log || echo "No build.log found"
                exit 1
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Prepare Artifact
        if: success()
        run: |
          cd build
          GENERATED_ISO=$(find . -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -z "$GENERATED_ISO" ]; then
            echo "[ERROR] ISO generation failed: No .iso file created."
            echo "=== Last 100 lines of build.log ==="
            tail -100 build.log || echo "No build.log found"
            exit 1
          fi
          echo "Found ISO: $GENERATED_ISO"
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M')
          FINAL_NAME="raptor-security-${BUILD_DATE}-amd64.iso"
          mv "$GENERATED_ISO" "$FINAL_NAME"
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
          echo "=== Final artifacts ==="
          ls -lah *.iso* 2>/dev/null || echo "No ISO artifacts"

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-security-iso
          path: |
            build/*.iso
            build/*.sha256

      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/build.log
            build/cache/build.log
