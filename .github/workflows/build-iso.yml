name: Build Raptor OS Security Edition

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Dynamic concurrency per git reference; auto-cancels superseded builds
concurrency:
  group: raptor-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reclaim Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso

      - name: Run Safe Cleanup
        run: |
          chmod +x ./auto/clean
          ./auto/clean

      - name: Build ISO
        run: |
          sudo lb build
